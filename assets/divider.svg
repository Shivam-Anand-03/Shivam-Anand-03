<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="8" viewBox="0 0 1200 8">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a3d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff5563"/>
      <stop offset="1" stop-color="#ff2a3d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect y="3" width="1200" height="2" fill="#220008"/>
  <rect x="-240" y="2" width="240" height="4" fill="url(#pulse)">
    <animate attributeName="x" values="-240;1200" dur="2.8s" repeatCount="indefinite"/>
  </rect>
</svg>
