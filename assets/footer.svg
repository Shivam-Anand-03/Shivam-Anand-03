<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
  <defs>
    <filter id="fglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="fgrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ff2a3d" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="150" fill="#060608"/>
  <rect width="1284" height="150" fill="url(#fgrid)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-42 0" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <ellipse cx="600" cy="75" rx="380" ry="90" fill="#ff2a3d" opacity="0.07">
    <animate attributeName="opacity" values="0.05;0.1;0.05" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <text x="600" y="66" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="34" text-anchor="middle" letter-spacing="8" fill="#ffffff" filter="url(#fglow)">THANKS FOR PLAYING</text>

  <g font-family="Arial, sans-serif" font-weight="bold" font-size="16" letter-spacing="4">
    <text x="520" y="108" text-anchor="end" fill="#9a9aa6">CONTINUE?</text>
    <text x="556" y="108" fill="#ff2a3d" filter="url(#fglow)">▶ YES<animate attributeName="opacity" values="1;1;0.25;1" keyTimes="0;0.55;0.7;1" dur="1.3s" repeatCount="indefinite"/></text>
    <text x="668" y="108" fill="#55555e">NO</text>
  </g>
</svg>
